# A general-purpose rulebook: write a first email to anyone, about anything you offer.
# In the app: Rulebook tab -> "Edit the rulebook as text" -> paste this in -> change the
# two lines marked CHANGE ME -> Save as new version.

seller: CHANGE ME (your name or company)
what_we_sell: >-
  CHANGE ME. One or two plain sentences on what you offer or why you are writing.

# "anyone" = no job-title check. Use "titles" (and fill buyer_titles) to limit it again.
who_to_email: anyone
buyer_titles: []
not_buyer_titles: []

do_not_contact: []

# How much each kind of news matters (high / medium / low) and the sentence that links it to you
topics:
  new-role:  {priority: high,   link: "A new role is a natural moment to talk about what comes next."}
  launch:    {priority: high,   link: "A launch is a busy time, and that is often when extra help matters."}
  funding:   {priority: medium, link: "Growth after new funding usually opens up new priorities."}
  hiring:    {priority: medium, link: "Hiring usually means the team is growing and needs are changing."}
  talk:      {priority: medium, link: "You spoke about this publicly, so it is clearly something you care about."}
  expansion: {priority: low,    link: "Expanding usually brings new questions."}
  award:     {priority: low,    link: "Congratulations on that. It says a lot about the team."}

never_mention: [layoff, laid off, lawsuit, sued, death, died, illness, bankruptcy, investigation, scandal]

angles:
  default: what matters most in their role

limits:
  strong_hook: 0.60
  minimum_hook: 0.45
  max_age_days: 180
  unknown_date_days: 90
  max_words: 130
  company_cooldown_days: 14

compliance:
  opt_out_line: "If you'd rather I didn't follow up, just let me know."
  blocked_countries: [canada]
  work_facts_only: true

writing_rules:
  - Open with the fact, then link it to what we offer in one sentence.
  - One clear ask, a 15-minute call. No meeting times or calendar links.
  - Plain words. No flattery and no hype.
banned_phrases: [game-changer, revolutionary, synergy, "I hope this email finds you well", "circle back"]
