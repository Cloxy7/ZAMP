# Agent Operating Procedure (rulebook) for the outreach drafter.
# Plain English. The rep can edit this in the app; the code reads it on every run.

seller: Zamp
what_we_sell: >-
  AI employees that run finance back-office work end to end, such as invoice
  processing, chargebacks and vendor onboarding, and only ask a person when unsure.

# Who buys from us, and who doesn't (matched against the person's job title)
buyer_titles: [cfo, chief financial, vp finance, head of finance, finance director, controller, ap manager, accounts payable, finance manager, treasurer]
not_buyer_titles: [engineer, developer, designer, marketing, recruiter, sales]

# Never research or contact these companies
do_not_contact:
  - company: Acme Robotics
    reason: existing customer

# How much each kind of news matters to us (high / medium / low),
# and the sentence that links it to what we sell
topics:
  hiring-ap:   {priority: high,   link: "Adding AP headcount is often a sign invoice volume is outgrowing the process."}
  pain-close:  {priority: high,   link: "Long closes usually come from manual invoice matching and chasing exceptions."}
  chargebacks: {priority: high,   link: "Dispute queues are hard to staff for when volume suddenly jumps."}
  erp:         {priority: medium, link: "A system move is a good moment to fix how invoices get matched and approved."}
  new-role:    {priority: medium, link: "The first months in a finance seat are usually when people look hard at how AP runs."}
  funding:     {priority: medium, link: "Growth after a raise usually means more vendors and more invoices."}
  expansion:   {priority: low,    link: "New sites usually bring new vendors and more invoices to process."}
  award:       {priority: low,    link: "Growth like that tends to mean more vendors to pay."}

# Never use these as a hook or mention them in a draft
never_mention: [layoff, laid off, lawsuit, sued, death, died, illness, bankruptcy, investigation, scandal]

# What each role cares about (matched against the job title)
angles:
  cfo: cost and how fast the books close
  controller: accuracy and a clean audit trail
  vp finance: scaling finance without adding headcount
  head of finance: scaling finance without adding headcount
  ap manager: less manual matching and fewer exceptions
  default: less manual work in AP

limits:
  strong_hook: 0.60      # a hook this good needs no extra review
  minimum_hook: 0.45     # below this, no fact is used at all
  max_age_days: 180      # older news is ignored
  unknown_date_days: 90  # a fact with no date counts as this old
  max_words: 130
  company_cooldown_days: 14   # warn if someone else at the same company got a draft this recently

# Legal and privacy basics for cold email
# The footer offers a way out; it asks for nothing. Silence is a fine answer.
# The sending tool (Gmail, Outreach...) adds the unsubscribe link and postal address.
compliance:
  opt_out_line: "If you'd rather I didn't follow up, just let me know."
  blocked_countries: [canada]   # CASL generally needs express consent before commercial email
  work_facts_only: true         # never use family, health, hobbies or other personal-life facts

writing_rules:
  - Open with the fact, then link it to what we sell in one sentence.
  - One clear ask, a 15-minute call. No meeting times or calendar links.
  - Plain, human tone. No flattery and no buzzwords.

banned_phrases: [hope this finds you, quick question, synergy, just checking in, circle back, game-changing, revolutionary]
