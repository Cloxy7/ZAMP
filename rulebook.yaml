# Zamp rulebook (broad): Zamp sells digital employees for many functions, not only finance.
# Rulebook tab -> "Edit the rulebook as text" -> delete everything -> paste this -> Save as new version.

seller: Zamp
what_we_sell: >-
  AI digital employees that run business processes end to end, such as invoice
  processing, accounting close, vendor onboarding, chargebacks, purchase approvals
  and customer operations, and only ask a person when unsure.

# "anyone" = no job-title check. Change to "titles" to go back to finance roles only.
who_to_email: anyone
buyer_titles: [cfo, chief financial, vp finance, head of finance, finance director, controller, ap manager, accounts payable, finance manager, treasurer]
not_buyer_titles: []

do_not_contact:
  - company: Acme Robotics
    reason: existing customer

# How much each kind of news matters (high / medium / low), and the sentence that links it to Zamp
topics:
  hiring-ap:   {priority: high,   link: "Hiring for a process team is often a sign the work is outgrowing how it is done today."}
  pain-close:  {priority: high,   link: "Slow, manual processes usually come from matching records by hand and chasing exceptions."}
  chargebacks: {priority: high,   link: "Dispute and exception queues are hard to staff for when volume suddenly jumps."}
  new-role:    {priority: medium, link: "The first months in a new seat are usually when people look hard at how the team's work runs."}
  funding:     {priority: medium, link: "Growth after a raise usually means more vendors, more transactions and more operations work."}
  erp:         {priority: medium, link: "A system move is a good moment to fix how routine work gets processed and approved."}
  launch:      {priority: medium, link: "A launch usually brings more customers and more operations work behind the scenes."}
  expansion:   {priority: low,    link: "New sites usually bring new vendors, suppliers and more processes to run."}
  award:       {priority: low,    link: "Growth like that tends to mean more operations work behind the scenes."}

# Never use these as a hook or mention them in a draft
never_mention: [layoff, laid off, lawsuit, sued, death, died, illness, bankruptcy, investigation, scandal, mental health, burnout, depression, anxiety, divorce, cancer, diagnosis, harassment, discrimination]

angles:
  cfo: cost and how fast the books close
  controller: accuracy and a clean audit trail
  vp finance: scaling finance without adding headcount
  head of finance: scaling finance without adding headcount
  ap manager: less manual matching and fewer exceptions
  default: less manual work in day-to-day operations

limits:
  strong_hook: 0.60
  minimum_hook: 0.45
  max_age_days: 180
  unknown_date_days: 90
  max_words: 130
  company_cooldown_days: 14

compliance:
  opt_out_line: "If you'd rather I didn't follow up, just let me know."
  blocked_countries: [canada]
  work_facts_only: true

writing_rules:
  - Open with the fact, then link it to what Zamp does in one sentence.
  - One clear ask, a 15-minute call. No meeting times or calendar links.
  - Plain, human tone. No flattery and no buzzwords.

banned_phrases: [hope this finds you, quick question, synergy, just checking in, circle back, game-changing, revolutionary]
