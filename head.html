<title>Outreach Drafter</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
<style>
/* Layout: an "agent at work" console. Scenario strip on top; prospect banner and 10-step
   progress; live timeline on the left, the draft and its evidence on the right. */
:root{
  --bg:#f3f3f2; --surface:#ffffff; --surface-2:#f8f8f7; --ink:#15171a; --muted:#5e646d; --faint:#8d929a; --line:#e2e2e0;
  --accent:#5b3fd1; --accent-soft:#efebff;
  --glow-1:#f5a54a; --glow-2:#ea5d5d; --glow-3:#8b6cf0;
  --ok:#1a7a4a; --ok-soft:#e3f3ea; --warn:#a15c00; --warn-soft:#fcf0db; --bad:#b52f27; --bad-soft:#fbe7e5;
  --sans:"Geist",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:12px; --shadow:0 1px 2px rgba(20,22,26,.04),0 4px 16px rgba(20,22,26,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1012; --surface:#17191c; --surface-2:#1d2024; --ink:#eceef0; --muted:#a2a8b0; --faint:#737a83; --line:#2a2e33;
  --accent:#a693ff; --accent-soft:#251f40; --ok:#5fcf8e; --ok-soft:#14301f; --warn:#e6a751; --warn-soft:#33260f; --bad:#f0857b; --bad-soft:#3a1c19;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1012; --surface:#17191c; --surface-2:#1d2024; --ink:#eceef0; --muted:#a2a8b0; --faint:#737a83; --line:#2a2e33;
  --accent:#a693ff; --accent-soft:#251f40; --ok:#5fcf8e; --ok-soft:#14301f; --warn:#e6a751; --warn-soft:#33260f; --bad:#f0857b; --bad-soft:#3a1c19;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
.section{display:flex;flex-direction:column;gap:16px}
/* simple view by default; body.details shows the inner workings */
body:not(.details) .det{display:none!important}
body.details .simple{display:none!important}
.intro{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:22px;padding:18px 20px;align-items:start}
@media(max-width:860px){.intro{grid-template-columns:1fr}}
.intro h2{font-size:16px;margin-bottom:6px}
.intro p{margin:0;color:var(--muted);font-size:14px;max-width:62ch}
.intro-try ol{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:6px}
.intro-try li{display:grid;grid-template-columns:22px 1fr;gap:9px;align-items:center;font-size:13px}
.intro-try .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font:500 11px var(--mono);background:var(--surface-2);border:1px solid var(--line)}
.intro-try .n svg{width:12px;height:12px}
.intro-try li.done{color:var(--muted)}
.intro-try li.done .n{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.phasebar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding:0 16px 16px}
.phasebar div{display:grid;gap:6px;font-size:12px;color:var(--faint);min-width:0}
.phasebar span{height:5px;border-radius:3px;background:var(--line)}
.phasebar .run span{background:linear-gradient(90deg,var(--glow-1),var(--glow-2),var(--glow-3));background-size:200% 100%;animation:flow 1.2s linear infinite}
.phasebar .done span{background:var(--ok)} .phasebar .flag span,.phasebar .wait span{background:var(--warn)} .phasebar .stop span{background:var(--bad)}
.phasebar .run,.phasebar .done,.phasebar .flag,.phasebar .wait,.phasebar .stop{color:var(--ink)}
.detrow{display:flex;justify-content:flex-end}
.switch{display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-size:13px;margin:0;font-weight:400}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.knob{width:34px;height:20px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .2s}
.knob::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .2s}
.switch input:checked+.knob{background:var(--ink)}
.switch input:checked+.knob::after{transform:translateX(14px)}
.switch input:focus-visible+.knob{outline:2px solid var(--accent);outline-offset:2px}
.phases{list-style:none;margin:0;padding:6px 8px 10px}
.ph{display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;padding:12px 8px;position:relative}
.ph:not(:last-child)::after{content:"";position:absolute;left:22px;top:44px;bottom:-6px;width:2px;background:var(--line)}
.ph .tl-ico{width:30px;height:30px}
.ph b{display:block;font-size:14.5px}
.ph p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.ph.run{background:var(--surface-2);border-radius:10px}
.ph.run .tl-ico{color:var(--accent);border-color:transparent;background:var(--surface)}
.ph.run .tl-ico::before{content:"";position:absolute;inset:-3px;border-radius:50%;padding:2px;background:conic-gradient(var(--glow-1),var(--glow-2),var(--glow-3),var(--glow-1));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:spin 1.1s linear infinite}
.ph.done .tl-ico{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.ph.flag .tl-ico,.ph.wait .tl-ico{background:var(--warn);border-color:var(--warn);color:var(--surface)}
.ph.stop .tl-ico{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.ph.flag p,.ph.wait p{color:var(--warn)} .ph.stop p{color:var(--bad)}
.ph.skip{opacity:.4}
.inshort{padding:16px 18px;display:grid;grid-template-columns:40px 1fr;gap:14px;align-items:start}
.inshort .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center}
.inshort .ic svg{width:20px;height:20px}
.inshort h3{font-size:16px;margin-bottom:4px}
.inshort p{margin:0;color:var(--muted);font-size:14px;max-width:70ch}
.inshort ul{margin:8px 0 0;padding-left:18px;font-size:13.5px}
.why{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.why li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;font-size:13.5px}
.why .lbl{font:600 10.5px var(--mono);letter-spacing:.05em;text-transform:uppercase;padding:3px 7px;border-radius:5px;white-space:nowrap;margin-top:1px}
.lbl.used{background:var(--ink);color:var(--surface)} .lbl.also{background:var(--accent-soft);color:var(--accent)}
.lbl.skip{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)} .lbl.out{background:var(--bad-soft);color:var(--bad)}
.why .because{display:block;color:var(--muted);font-size:12.5px}
.strength{font-size:11.5px;font-weight:600;margin-left:6px;color:var(--faint)}
.checkline{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:500}
.checkline svg{width:16px;height:16px}
details.more summary{cursor:pointer;color:var(--muted);font-size:12.5px;margin-top:8px;list-style:none;text-decoration:underline;text-underline-offset:3px}
details.more summary::-webkit-details-marker{display:none}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 var(--sans);
  padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{text-wrap:balance;margin:0}
.muted{color:var(--muted)} .faint{color:var(--faint)} .mono{font-family:var(--mono)}
.num{font-variant-numeric:tabular-nums}

/* header */
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.mark{width:34px;height:34px;border-radius:10px;flex:none;background:conic-gradient(from 210deg,var(--glow-1),var(--glow-2),var(--glow-3),var(--glow-1));position:relative}
.mark::after{content:"";position:absolute;inset:9px;border-radius:4px;background:var(--surface)}
.brand h1{font-size:19px;font-weight:650;letter-spacing:-.015em}
.brand p{margin:0;color:var(--muted);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:4px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--warn)}
.chip.live .dot{background:var(--ok)}
.textbtn{background:none;border:0;color:var(--muted);font-size:12.5px;padding:4px 6px;text-decoration:underline;text-underline-offset:3px}

/* tabs */
.tabs{display:flex;gap:2px;padding:3px;background:var(--surface);border:1px solid var(--line);border-radius:12px;width:max-content;max-width:100%;overflow-x:auto}
.tabs button{border:0;background:none;padding:7px 14px;border-radius:9px;font-weight:550;font-size:13.5px;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected=true]{background:var(--ink);color:var(--surface)}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:14px 16px 0}
.card-h h3{font-size:13px;font-weight:600}
.card-b{padding:12px 16px 16px}
.eyebrow{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}

/* guided demo */
.tour{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;padding:12px 16px}
.tour ol{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.tour li{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:5px 10px 5px 6px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line)}
.tour li .n{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font:500 11px var(--mono);background:var(--surface);border:1px solid var(--line)}
.tour li.done{color:var(--muted)}
.tour li.done .n{background:var(--ok);border-color:var(--ok);color:var(--surface)}
@media(max-width:700px){.tour{grid-template-columns:1fr}}

/* scenarios */
.scen-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.scen-h h2{font-size:15px;font-weight:600}
.scen{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 8px;scroll-snap-type:x proximity}
.sc{flex:0 0 212px;scroll-snap-align:start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:6px;transition:border-color .15s,transform .15s}
.sc:hover{border-color:var(--ink);transform:translateY(-1px)}
.sc[aria-pressed=true]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.sc .row1{display:flex;justify-content:space-between;align-items:center;gap:6px}
.tag{font:500 10.5px var(--mono);letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:5px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.tag.hp{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.tag.edge{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.tag.rule{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.tag.fail{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.sc b{font-size:14px;font-weight:600}
.sc .co{font-size:12.5px;color:var(--muted);margin-top:-5px}
.sc p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.45}
.sc .seen{width:16px;height:16px;color:var(--ok)}
.sc.custom{border-style:dashed;justify-content:center;align-items:flex-start}
.custom-form{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) auto;gap:10px;align-items:end;padding:14px 16px}
@media(max-width:800px){.custom-form{grid-template-columns:1fr}}
label{display:block;font-size:12px;font-weight:600;margin-bottom:4px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 11px}
textarea{line-height:1.55;resize:vertical}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--ink);background:var(--ink);color:var(--surface);font-weight:600;font-size:13.5px;border-radius:9px;padding:8px 14px}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.ok{background:var(--ok);border-color:var(--ok)}
.btn.danger{background:var(--surface);color:var(--bad);border-color:var(--line)}
.btn.danger:hover{border-color:var(--bad)}
.btn:disabled{opacity:.45;cursor:default}
.btn svg{width:15px;height:15px}

/* prospect banner */
.banner{display:flex;align-items:center;gap:14px;padding:16px;flex-wrap:wrap}
.avatar{width:48px;height:48px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:650;font-size:16px;color:#fff;
  background:linear-gradient(135deg,var(--glow-1),var(--glow-2) 55%,var(--glow-3))}
.avatar.idle{background:var(--surface-2);color:var(--faint);border:1px dashed var(--line)}
.who{flex:1 1 220px;min-width:0}
.who h2{font-size:20px;font-weight:650;letter-spacing:-.015em}
.who .sub{color:var(--muted);font-size:13.5px}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--faint);margin-top:4px}
.status{display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:13px;padding:6px 12px 6px 9px;border-radius:999px;white-space:nowrap}
.status svg{width:16px;height:16px}
.s-ok{background:var(--ok-soft);color:var(--ok)} .s-warn{background:var(--warn-soft);color:var(--warn)} .s-bad{background:var(--bad-soft);color:var(--bad)}
.s-run{background:var(--accent-soft);color:var(--accent)}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* progress */
.progress{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;padding:0 16px 14px}
.progress span{height:5px;border-radius:3px;background:var(--line);transition:background .25s}
.progress .run{background:linear-gradient(90deg,var(--glow-1),var(--glow-2),var(--glow-3));background-size:200% 100%;animation:flow 1.2s linear infinite}
.progress .done{background:var(--ok)} .progress .flag,.progress .wait{background:var(--warn)} .progress .stop{background:var(--bad)}
@keyframes flow{to{background-position:-200% 0}}
.plabel{padding:0 16px 14px;margin-top:-6px;font-size:12px;color:var(--muted)}

/* work area */
.work{display:grid;grid-template-columns:minmax(0,370px) minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:940px){.work{grid-template-columns:1fr}}
.timeline{list-style:none;margin:0;padding:8px}
.tl{border-radius:10px;transition:background .2s}
.tl+.tl{margin-top:2px}
.tl-head{width:100%;display:grid;grid-template-columns:28px minmax(0,1fr) 14px;gap:10px;align-items:center;text-align:left;background:none;border:0;padding:8px}
.tl-ico{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:500 11.5px var(--mono);color:var(--faint);background:var(--surface-2);border:1px solid var(--line);position:relative}
.tl-ico svg{width:14px;height:14px}
.tl.run{background:var(--surface-2)}
.tl.run .tl-ico{color:var(--accent);border-color:transparent;background:var(--surface)}
.tl.run .tl-ico::before{content:"";position:absolute;inset:-3px;border-radius:50%;padding:2px;
  background:conic-gradient(var(--glow-1),var(--glow-2),var(--glow-3),var(--glow-1));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:spin 1.1s linear infinite}
.tl.done .tl-ico{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.tl.flag .tl-ico,.tl.wait .tl-ico{background:var(--warn);border-color:var(--warn);color:var(--surface)}
.tl.stop .tl-ico{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.tl.skip{opacity:.45}
.tl-title{font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.role{font:500 10px var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--faint);border:1px solid var(--line);border-radius:4px;padding:0 5px}
.role.ai{color:var(--accent);border-color:var(--accent-soft);background:var(--accent-soft)}
.role.you{color:var(--ok);background:var(--ok-soft);border-color:transparent}
.tl-sum{display:block;font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl.flag .tl-sum,.tl.wait .tl-sum{color:var(--warn)} .tl.stop .tl-sum{color:var(--bad)}
.chev{width:14px;height:14px;color:var(--faint);transition:transform .2s}
.tl-head[aria-expanded=true] .chev{transform:rotate(90deg)}
.tl-log{margin:0 8px 8px 46px;padding:8px 10px;border-radius:8px;background:var(--surface-2);font:12px/1.5 var(--mono);color:var(--muted);overflow-wrap:anywhere}
.tl-log div+div{margin-top:3px}
.l-good{color:var(--ok)} .l-bad{color:var(--bad)} .l-mid{color:var(--warn)}
.tl-note{padding:14px 16px;font-size:13px;color:var(--muted)}

/* result column */
.result{display:flex;flex-direction:column;gap:14px;min-width:0}
.empty{padding:36px 22px;text-align:center;color:var(--muted)}
.empty h3{font-size:16px;color:var(--ink);margin-bottom:6px}
.empty .steps3{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:14px}
.callouts{display:flex;flex-direction:column;gap:6px}
.callout{display:grid;grid-template-columns:18px 1fr;gap:9px;align-items:start;padding:10px 12px;border-radius:10px;font-size:13px;background:var(--warn-soft)}
.callout svg{width:16px;height:16px;color:var(--warn);margin-top:2px}
.callout.bad{background:var(--bad-soft)} .callout.bad svg{color:var(--bad)}

.mail-meta{display:grid;grid-template-columns:62px 1fr;gap:6px 10px;padding:14px 18px;border-bottom:1px solid var(--line);font-size:13px}
.mail-meta dt{color:var(--faint)} .mail-meta dd{margin:0;min-width:0;overflow-wrap:anywhere}
.mail-meta .subj{font-weight:600}
.mail-body{padding:18px;font-size:14.5px;line-height:1.65;max-width:68ch}
.mail-body p{margin:0 0 12px}
.mail-body p.in{animation:rise .45s ease both}
@keyframes rise{from{opacity:0;transform:translateY(4px)}}
.cite{display:inline-grid;place-items:center;min-width:19px;height:19px;padding:0 5px;margin:0 1px;border-radius:6px;border:0;
  background:var(--accent-soft);color:var(--accent);font:600 11px var(--mono);vertical-align:2px}
.cite:hover,.cite.hot{background:var(--accent);color:var(--surface)}
.mail-foot{margin:0 18px;padding:10px 0 14px;border-top:1px dashed var(--line);font-size:12.5px;color:var(--muted)}
.mail-foot small{display:block;color:var(--faint);font-size:11.5px;margin-top:2px}
.reviewbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 18px;border-top:1px solid var(--line);background:var(--surface-2);border-radius:0 0 var(--r) var(--r)}
.reviewbar .grow{flex:1}
.revform{display:grid;gap:10px;padding:14px 18px;border-top:1px solid var(--line)}
.reviewed{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px}

.sources{display:grid;gap:8px}
.src{display:grid;grid-template-columns:24px minmax(0,1fr);gap:10px;padding:10px;border-radius:10px;border:1px solid var(--line);transition:border-color .15s,background .15s}
.src.hot{border-color:var(--accent);background:var(--accent-soft)}
.src .k{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font:600 11px var(--mono)}
.src .f{font-weight:550;font-size:13px}
.src q{display:block;quotes:none;margin-top:5px;padding-left:9px;border-left:2px solid var(--accent);font-size:12.5px;color:var(--muted)}
