# One-click setup for Render (render.com). Keys are added in the Render dashboard, never here.
services:
  - type: web
    name: outreach-drafter
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MOCK
        value: "0"
      - key: CACHE_TTL_DAYS
        value: "0"
      - key: TAVILY_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
